<!DOCTYPE html>
<html lang="id" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
        Soeltan Medsos | Jasa SMM Panel Followers, Subscriber, Like dan View Media
        Sosial
    </title>
    <meta name="description"
        content="Tingkatkan popularitas media sosial Anda dengan jasa followers, like, view, dan jam tayang dari Soeltan Medsos. Layanan aman, cepat, dan terpercaya." />
    <meta name="keywords"
        content="jasa followers, beli like, tambah jam tayang, soeltan medsos, jasa tiktok, jasa instagram, followers murah, like indonesia, view youtube" />
    <link rel="icon" type="image/png" href="LOGO-.png" />
    <link rel="canonical" href="https://www.domainsultanmedsos.com/" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        body {
            font-family: "Inter", sans-serif;
            background-color: #f8fafc;
            color: #334155;
        }
        .form-input {
            width: 100%;
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            color: #1e293b;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.2);
        }
        .hidden {
            display: none;
        }
        /* Styling untuk Toast Notification */
        #toast-container {
            position: fixed;
            bottom: 1.25rem;
            right: 1.25rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.75rem;
        }
        .toast {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            color: white;
            font-weight: 600;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(0%);
        }
        .toast.success {
            background-color: #10B981; /* Green-500 */
        }
        .toast.error {
            background-color: #EF4444; /* Red-500 */
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-700">
    <div id="toast-container"></div>
    
    <div id="announcement-modal"
        class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4 hidden">
        <div id="announcement-modal-content"
            class="bg-white p-6 rounded-lg w-full max-w-md max-h-[90vh] flex flex-col border border-slate-200 shadow-2xl">
        </div>
    </div>

    <nav class="sticky top-0 z-40 bg-white/80 backdrop-blur-sm border-b border-slate-200">
        <div class="container mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between h-16">
                <a href="#" class="text-xl font-bold text-slate-900">Soeltan<span class="text-teal-600">Medsos</span></a>
                <div class="flex items-center">
                    <button onclick="showCartModal()" class="relative text-slate-600 p-2 rounded-full hover:bg-slate-200 transition-colors ml-4" aria-label="Tampilkan Keranjang">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                        <span id="cart-count" class="absolute -top-1 -right-1 bg-teal-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 sm:px-6 py-12">
        <header class="text-center my-12 md:my-16">
            <img src="LOGO-.png" alt="Logo Soeltan Medsos" class="mx-auto mb-8 w-48 md:w-64" />
            <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold text-slate-900 mb-4">
                Tingkatkan Engagement Media Sosial Anda
            </h1>
        </header>

        <section id="buat-pesanan" class="my-16 md:my-24 max-w-2xl mx-auto">
            <h2 class="text-3xl font-bold text-center mb-12 text-teal-600">
                Buat Pesanan Baru
            </h2>
            <div class="bg-white p-6 sm:p-8 rounded-xl border border-slate-200 shadow-lg">
                <form id="order-form" onsubmit="event.preventDefault(); handleAddToCart();" novalidate class="space-y-5">
                    
                    <div>
                        <label for="platform-select" class="block text-sm font-medium text-slate-700 mb-1">1. Pilih Kategori</label>
                        <select id="platform-select" class="form-input" required>
                            <option value="">-- Pilih Kategori --</option>
                        </select>
                    </div>

                    <div id="sub-platform-container" class="hidden">
                        <label for="sub-platform-select" class="block text-sm font-medium text-slate-700 mb-1">2. Pilih Aplikasi</label>
                        <select id="sub-platform-select" class="form-input">
                            <option value="">-- Pilih Aplikasi --</option>
                        </select>
                    </div>

                    <div>
                        <label for="service-dropdown" class="block text-sm font-medium text-slate-700 mb-1">3. Pilih Layanan</label>
                        <select id="service-dropdown" class="form-input" required disabled>
                            <option value="">-- Pilih Kategori Dulu --</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Harga Satuan</label>
                        <div id="price-display" class="w-full bg-slate-100 border border-slate-300 rounded-lg px-3 py-2 text-teal-600 font-bold">Rp 0</div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Detail Layanan</label>
                        <div id="order-details" class="w-full min-h-[60px] bg-slate-100 border border-slate-300 rounded-lg px-3 py-2 text-slate-600 text-sm">-</div>
                    </div>

                    <div id="target-link-container">
                        <label for="target-link" class="block text-sm font-medium text-slate-700 mb-1">4. Link Target</label>
                        <input type="url" id="target-link" placeholder="https://..." class="form-input" />
                    </div>

                    <div>
                        <label for="quantity-input" class="block text-sm font-medium text-slate-700 mb-1">5. Masukan Jumlah</label>
                        <input type="number" id="quantity-input" min="1" placeholder="Contoh: 1000" class="form-input" required />
                    </div>

                    <div class="mt-8 pt-6 border-t border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="text-center md:text-left">
                            <span class="text-slate-600">Total Harga:</span>
                            <div id="total-price" class="text-3xl font-bold text-teal-600">Rp 0</div>
                        </div>
                        <button type="submit" class="w-full md:w-auto px-6 py-3 bg-teal-500 hover:bg-teal-600 text-white font-bold rounded-lg transition-colors shadow-md shadow-teal-500/20">
                            + Masukan Keranjang
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <div id="modal-container" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden p-4">
        <div id="modal-content" class="bg-white p-6 rounded-lg w-full max-w-md max-h-[90vh] flex flex-col border border-slate-200 shadow-2xl">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
